name: Devin CI Fix

on:
  workflow_run:
    workflows: ["Spring Boot CI/CD"]
    types: [completed]

jobs:
  trigger-devin:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
    - name: Create Devin session
      env:
        DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      run: |
        BRANCH="${{ github.event.workflow_run.head_branch }}"
        REPO="${{ github.event.repository.html_url }}"
        
        cat > /tmp/payload.json <<EOF
{
  "prompt": "Fix the failing CI build in this Spring Boot project. Repository: $REPO Branch: $BRANCH Steps: 1. Clone the repo and checkout the branch 2. Run ./gradlew spotlessCheck 3. Run ./gradlew spotlessApply if needed 4. Fix any compilation errors 5. Run ./gradlew clean build to verify 6. Commit and push the fixes",
  "title": "Fix CI Build - $BRANCH"
}
EOF
        
        curl -X POST https://api.devin.ai/v1/sessions \
          -H "Authorization: Bearer $DEVIN_API_KEY" \
          -H "Content-Type: application/json" \
          -d @/tmp/payload.json
