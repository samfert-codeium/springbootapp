name: Devin CI Fix

on:
  workflow_run:
    workflows: ["Spring Boot CI/CD"]
    types: [completed]

jobs:
  trigger-devin:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
    - name: Create Devin session
      env:
        DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      run: |
        BRANCH="${{ github.event.workflow_run.head_branch }}"
        REPO="${{ github.event.repository.html_url }}"
        
        curl -X POST https://api.devin.ai/v1/sessions \
          -H "Authorization: Bearer $DEVIN_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{
            \"prompt\": \"Fix the failing CI build in this Spring Boot project.\n\nRepository: $REPO\nBranch: $BRANCH\n\nSteps:\n1. Clone the repo and checkout the branch\n2. Run ./gradlew spotlessCheck\n3. Run ./gradlew spotlessApply if needed\n4. Fix any compilation errors\n5. Run ./gradlew clean build to verify\n6. Commit and push the fixes\",
            \"title\": \"Fix CI Build - $BRANCH\"
          }"
