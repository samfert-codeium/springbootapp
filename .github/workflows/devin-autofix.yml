name: Devin Auto-Fix Build Failures

on:
  workflow_run:
    workflows: ["Spring Boot CI/CD"]
    types: [completed]
    branches: ['**']

jobs:
  trigger-devin-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_branch }}
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Get build failure details
      id: failure-details
      run: |
        echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
        echo "commit=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
        echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
        echo "repo_url=${{ github.event.repository.html_url }}" >> $GITHUB_OUTPUT
        
    - name: Create Devin session for build fix
      id: create-devin-session
      run: |
        # Create a detailed prompt for Devin with build context
        PROMPT="Fix the failing CI/CD build in this Spring Boot project.

        Repository: ${{ steps.failure-details.outputs.repo_url }}
        Branch: ${{ steps.failure-details.outputs.branch }}
        Failed Commit: ${{ steps.failure-details.outputs.commit }}
        Build Run: ${{ steps.failure-details.outputs.repo_url }}/actions/runs/${{ steps.failure-details.outputs.run_id }}

        The build failed in the Spring Boot CI/CD pipeline. Please:
        1. Clone the repository and checkout the failing branch: ${{ steps.failure-details.outputs.branch }}
        2. Analyze the build failure by running: ./gradlew spotlessCheck and ./gradlew test
        3. Fix any compilation errors, formatting issues, or test failures
        4. Ensure the code follows Google Java Format standards
        5. Run the full build to verify: ./gradlew clean build
        6. Commit and push the fixes to the same branch
        7. Verify the new CI build passes

        Focus on fixing:
        - Java compilation errors (missing imports, syntax errors, type mismatches)
        - Code formatting violations (use ./gradlew spotlessApply if needed)
        - Failed unit tests
        - Any other build-related issues

        Make minimal, targeted fixes to resolve the build failure while preserving the intended functionality."

        # Call Devin API to create session
        RESPONSE=$(curl -s --request POST \
          --url https://api.devin.ai/v1/sessions \
          --header "Authorization: Bearer ${{ secrets.DEVIN_API_KEY }}" \
          --header "Content-Type: application/json" \
          --data "{
            \"prompt\": \"$PROMPT\",
            \"idempotent\": true,
            \"title\": \"Auto-fix CI build failure - ${{ steps.failure-details.outputs.branch }}\",
            \"tags\": [\"auto-fix\", \"ci-failure\", \"spring-boot\"]
          }")
        
        echo "devin_response=$RESPONSE" >> $GITHUB_OUTPUT
        
        # Extract session details
        SESSION_ID=$(echo "$RESPONSE" | jq -r '.session_id // empty')
        SESSION_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
        
        if [ -n "$SESSION_ID" ]; then
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
          echo "session_url=$SESSION_URL" >> $GITHUB_OUTPUT
          echo "✅ Devin session created successfully!"
          echo "Session ID: $SESSION_ID"
          echo "Session URL: $SESSION_URL"
        else
          echo "❌ Failed to create Devin session"
          echo "Response: $RESPONSE"
          exit 1
        fi

    - name: Create GitHub issue with Devin session link
      if: steps.create-devin-session.outputs.session_id
      uses: actions/github-script@v7
      with:
        script: |
          const sessionUrl = '${{ steps.create-devin-session.outputs.session_url }}';
          const sessionId = '${{ steps.create-devin-session.outputs.session_id }}';
          const branch = '${{ steps.failure-details.outputs.branch }}';
          const runId = '${{ steps.failure-details.outputs.run_id }}';
          
          const issueBody = `## 🤖 Devin Auto-Fix Triggered
          
          A build failure was detected and Devin has been automatically summoned to fix it!
          
          ### Build Details
          - **Branch**: \`${branch}\`
          - **Failed Build**: [View Run](${context.payload.repository.html_url}/actions/runs/${runId})
          - **Commit**: \`${{ steps.failure-details.outputs.commit }}\`
          
          ### Devin Session
          - **Session ID**: \`${sessionId}\`
          - **Session URL**: [View Devin Session](${sessionUrl})
          
          Devin will:
          1. ✅ Analyze the build failure
          2. ✅ Fix compilation/formatting/test issues  
          3. ✅ Push corrected code
          4. ✅ Trigger new CI build
          
          This issue will be automatically closed when the build passes.
          
          ---
          *Powered by Devin AI Auto-Fix Pipeline*`;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🤖 Auto-Fix: Build failure on ${branch}`,
            body: issueBody,
            labels: ['auto-fix', 'devin', 'ci-failure']
          });

    - name: Add comment to failing commit
      if: steps.create-devin-session.outputs.session_id
      uses: actions/github-script@v7
      with:
        script: |
          const sessionUrl = '${{ steps.create-devin-session.outputs.session_url }}';
          const sessionId = '${{ steps.create-devin-session.outputs.session_id }}';
          
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: '${{ steps.failure-details.outputs.commit }}',
            body: `🤖 **Devin Auto-Fix Activated**
            
            Build failed, but don't worry! Devin is on it.
            
            **Session**: [${sessionId}](${sessionUrl})
            
            Devin will analyze and fix the build issues, then push corrected code.`
          });
